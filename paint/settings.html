<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64b5f6;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(100, 181, 246, 0.3);
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            font-size: 15px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .field-key {
            font-size: 11px;
            color: #555;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #64b5f6;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(100, 181, 246, 0.1);
        }

        .server-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .server-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .server-btn:hover {
            background: rgba(100, 181, 246, 0.2);
            border-color: #64b5f6;
            color: #fff;
        }

        .server-btn.active {
            background: #64b5f6;
            border-color: #64b5f6;
            color: #fff;
        }

        .slider-container {
            margin-top: 10px;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #64b5f6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-value {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
            color: #64b5f6;
            font-size: 16px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            backdrop-filter: blur(20px);
            z-index: 1000;
        }

        .bottom-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .status-msg {
            font-size: 14px;
            color: #4caf50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-msg.show {
            opacity: 1;
        }

        .btn-complete {
            padding: 12px 40px;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.4);
            transition: all 0.3s ease;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.6);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .section {
                padding: 20px;
            }
            
            .server-options {
                flex-direction: column;
            }
            
            .server-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ 调试配置</h1>

        <!-- 基础选项 -->
        <div class="section">
            <div class="section-title">基础选项</div>
            
            <div class="field-group">
                <label class="field-label">用户名</label>
                <span class="field-key">username</span>
                <input type="text" id="username" placeholder="输入用户名...">
            </div>

            <div class="field-group">
                <label class="field-label">昵称</label>
                <span class="field-key">showname</span>
                <input type="text" id="showname" placeholder="输入昵称...">
            </div>
        </div>

        <!-- 画板设置 -->
        <div class="section">
            <div class="section-title">画板</div>
            
            <div class="field-group">
                <label class="field-label">服务器</label>
                <div class="field-desc">云协作使用的服务器</div>
                <span class="field-key">paint-wss</span>
                <div class="server-options">
                    <button class="server-btn" data-value="wss.turbowarp.org">wss.turbowarp.org</button>
                    <button class="server-btn" data-value="aaa.szysite.com">aaa.szysite.com</button>
                    <button class="server-btn" data-value="bbb.a.com">bbb.a.com</button>
                </div>
                <input type="text" id="paint-wss" placeholder="自定义服务器地址..." style="margin-top: 8px;">
            </div>

            <div class="field-group">
                <label class="field-label">画笔精度</label>
                <div class="field-desc">云协作的精细度，值越低越精细，但会消耗更多流量</div>
                <span class="field-key">paint-pen</span>
                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" id="paint-pen" min="0" max="20" value="10">
                        <span class="slider-value" id="pen-value">10</span>
                    </div>
                    <div class="slider-labels">
                        <span>精细 (0)</span>
                        <span>省流 (20)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部固定按钮 -->
    <div class="bottom-bar">
        <div class="bottom-content">
            <span class="status-msg" id="status">✓ 已保存</span>
            <button class="btn-complete" onclick="saveSettings()">完成</button>
        </div>
    </div>

    <script>
        // 初始化：从 localStorage 读取数据
        function loadSettings() {
            // 基础选项
            const username = localStorage.getItem('username') || '';
            const showname = localStorage.getItem('showname') || '';
            
            document.getElementById('username').value = username;
            document.getElementById('showname').value = showname;

            // 画板服务器
            const paintWss = localStorage.getItem('paint-wss') || '';
            document.getElementById('paint-wss').value = paintWss;
            
            // 设置服务器按钮状态
            updateServerButtons(paintWss);

            // 画笔精度
            const paintPen = localStorage.getItem('paint-pen') || '10';
            document.getElementById('paint-pen').value = paintPen;
            document.getElementById('pen-value').textContent = paintPen;
        }

        // 更新服务器按钮状态
        function updateServerButtons(currentValue) {
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => {
                if (btn.dataset.value === currentValue) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 服务器按钮点击事件
        document.querySelectorAll('.server-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const value = this.dataset.value;
                document.getElementById('paint-wss').value = value;
                updateServerButtons(value);
            });
        });

        // 自定义服务器输入监听
        document.getElementById('paint-wss').addEventListener('input', function() {
            updateServerButtons(this.value);
        });

        // 滑块实时更新
        document.getElementById('paint-pen').addEventListener('input', function() {
            document.getElementById('pen-value').textContent = this.value;
        });

        // 保存设置
        function saveSettings() {
            // 基础选项
            localStorage.setItem('username', document.getElementById('username').value);
            localStorage.setItem('showname', document.getElementById('showname').value);

            // 画板设置
            localStorage.setItem('paint-wss', document.getElementById('paint-wss').value);
            localStorage.setItem('paint-pen', document.getElementById('paint-pen').value);

            // 显示保存成功提示
            const status = document.getElementById('status');
            status.classList.add('show');
            setTimeout(() => {
                status.classList.remove('show');
            }, 2000);
        }

        // 页面加载时读取设置
        window.onload = loadSettings;
    </script>
</body>
</html>
