<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-label: #fff;
            --accent-color: #64b5f6;
            --accent-hover: #42a5f5;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.2);
            --key-bg: rgba(0, 0, 0, 0.3);
            --key-text: #555;
            --section-title: #64b5f6;
            --btn-text: #fff;
            --shadow: rgba(0, 0, 0, 0.3);
            --hover-shadow: rgba(100, 181, 246, 0.4);
            --success-color: #4caf50;
            --warning-color: #ff9800;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #e4e7f1;
            --bg-card: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --text-label: #1a202c;
            --accent-color: #4299e1;
            --accent-hover: #3182ce;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: rgba(0, 0, 0, 0.15);
            --key-bg: #edf2f7;
            --key-text: #a0aec0;
            --section-title: #2b6cb0;
            --btn-text: #fff;
            --shadow: rgba(0, 0, 0, 0.08);
            --hover-shadow: rgba(66, 153, 225, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-label);
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 5px;
            backdrop-filter: blur(10px);
        }

        .theme-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-btn.active {
            background: var(--accent-color);
            color: var(--btn-text);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .section.hidden {
            display: none;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--section-title);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            font-size: 15px;
            color: var(--text-label);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .field-key {
            font-size: 11px;
            color: var(--key-text);
            font-family: 'Courier New', monospace;
            background: var(--key-bg);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .server-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .server-btn {
            padding: 8px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .server-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .server-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--btn-text);
        }

        .slider-container {
            margin-top: 10px;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: var(--input-bg);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--hover-shadow);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-value {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 16px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .file-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-file {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-save {
            background: var(--success-color);
            color: white;
        }

        .btn-save:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-upload {
            background: var(--warning-color);
            color: white;
        }

        .btn-upload:hover {
            background: #f57c00;
            transform: translateY(-1px);
        }

        input[type="file"] {
            display: none;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            backdrop-filter: blur(20px);
            z-index: 1000;
            transition: background 0.3s ease;
        }

        .bottom-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .btn-close {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .btn-close:hover {
            color: var(--text-primary);
        }

        .status-msg {
            font-size: 14px;
            color: #4caf50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-msg.show {
            opacity: 1;
        }

        .btn-complete {
            padding: 12px 40px;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: 25px;
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--hover-shadow);
            transition: all 0.3s ease;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--hover-shadow);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .section {
                padding: 20px;
            }

            .server-options {
                flex-direction: column;
            }

            .server-btn {
                width: 100%;
                text-align: center;
            }

            .file-actions {
                flex-direction: column;
            }

            .btn-file {
                width: 100%;
                justify-content: center;
            }

            .bottom-content {
                flex-direction: column-reverse;
                gap: 10px;
            }

            .btn-close, .btn-complete {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 调试配置</h1>
            <div class="theme-toggle">
                <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" data-theme="auto" onclick="setTheme('auto')">⚡ 自动</button>
            </div>
        </div>

        <!-- 基础选项 -->
        <div class="section">
            <div class="section-title">基础选项</div>

            <div class="field-group">
                <label class="field-label">用户名</label>
                <span class="field-key">username</span>
                <input type="text" id="username" placeholder="输入用户名...">
            </div>

            <div class="field-group">
                <label class="field-label">昵称</label>
                <span class="field-key">showname</span>
                <input type="text" id="showname" placeholder="输入昵称...">
            </div>
        </div>

        <!-- 云变量服务器（全局设置） -->
        <div class="section">
            <div class="section-title">云变量服务器</div>

            <div class="field-group">
                <div class="field-desc">云变量和云协作使用的服务器</div>
                <span class="field-key">cloud-server</span>
                <div class="server-options">
                    <button class="server-btn" data-value="wss.turbowarp.org">wss.turbowarp.org</button>
                </div>
                <input type="text" id="cloud-server" placeholder="自定义服务器地址..." style="margin-top: 8px;">
            </div>
        </div>

        <!-- 画板设置（条件显示） -->
        <div class="section" id="paint-section">
            <div class="section-title">画板</div>

            <div class="field-group">
                <label class="field-label">画笔精度</label>
                <div class="field-desc">云协作的精细度，值越低越精细，但会消耗更多流量</div>
                <span class="field-key">paint-pen</span>
                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" id="paint-pen" min="0" max="20" value="0">
                        <span class="slider-value" id="pen-value">0</span>
                    </div>
                    <div class="slider-labels">
                        <span>精细 (0)</span>
                        <span>省流 (20)</span>
                    </div>
                </div>
            </div>

            <!-- 保存/上传功能（条件显示） -->
            <div class="field-group" id="save-group">
                <label class="field-label">保存数据</label>
                <div class="field-desc">管理本地存储的保存数据</div>
                <span class="field-key">save</span>
                <div class="file-actions">
                    <button class="btn-file btn-save" onclick="downloadSave()">
                        💾 保存到本地
                    </button>
                    <button class="btn-file btn-upload" onclick="document.getElementById('upload-input').click()">
                        📤 上传
                    </button>
                    <input type="file" id="upload-input" accept=".szy" onchange="uploadSave(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- 底部固定按钮 -->
    <div class="bottom-bar">
        <div class="bottom-content">
            <span class="status-msg" id="status">✓ 已保存</span>
            <button class="btn-close" onclick="saveAndClose()">保存并关闭</button>
            <button class="btn-complete" onclick="saveSettings()">完成</button>
        </div>
    </div>

    <script>
        // 主题管理
        function initTheme() {
            const savedTheme = localStorage.getItem('debug-theme') || 'auto';
            applyTheme(savedTheme);
            updateThemeButtons(savedTheme);
        }

        function applyTheme(theme) {
            if (theme === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        function setTheme(theme) {
            localStorage.setItem('debug-theme', theme);
            applyTheme(theme);
            updateThemeButtons(theme);
        }

        function updateThemeButtons(activeTheme) {
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === activeTheme) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 监听系统主题变化（仅在自动模式下）
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const currentTheme = localStorage.getItem('debug-theme') || 'auto';
            if (currentTheme === 'auto') {
                applyTheme('auto');
            }
        });

        // 检查是否应该显示画板设置
        function checkPaintSection() {
            // 检查本地是否有任何画板相关的键值
            const hasPaintWss = localStorage.getItem('paint-wss') !== null;
            const hasPaintPen = localStorage.getItem('paint-pen') !== null;
            const hasSave = localStorage.getItem('save') !== null;

            const paintSection = document.getElementById('paint-section');
            const saveGroup = document.getElementById('save-group');

            // 如果有任何画板相关键值，显示画板设置
            if (hasPaintWss || hasPaintPen || hasSave) {
                paintSection.classList.remove('hidden');

                // 如果有save键值，显示保存/上传功能
                if (hasSave) {
                    saveGroup.classList.remove('hidden');
                } else {
                    saveGroup.classList.add('hidden');
                }
            } else {
                paintSection.classList.add('hidden');
            }
        }

        // 初始化：从 localStorage 读取数据
        function loadSettings() {
            // 基础选项
            const username = localStorage.getItem('username') || '';
            const showname = localStorage.getItem('showname') || '';

            document.getElementById('username').value = username;
            document.getElementById('showname').value = showname;

            // 云变量服务器 - 默认为 wss.turbowarp.org
            const cloudServer = localStorage.getItem('cloud-server') || 'wss.turbowarp.org';
            document.getElementById('cloud-server').value = cloudServer;
            updateServerButtons(cloudServer);

            // 画笔精度 - 默认为0
            const paintPen = localStorage.getItem('paint-pen');
            const penValue = paintPen !== null ? paintPen : '0';
            document.getElementById('paint-pen').value = penValue;
            document.getElementById('pen-value').textContent = penValue;

            // 检查并更新画板显示状态
            checkPaintSection();
        }

        // 更新服务器按钮状态
        function updateServerButtons(currentValue) {
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => {
                if (btn.dataset.value === currentValue) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 服务器按钮点击事件
        document.querySelectorAll('.server-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const value = this.dataset.value;
                document.getElementById('cloud-server').value = value;
                updateServerButtons(value);
            });
        });

        // 自定义服务器输入监听
        document.getElementById('cloud-server').addEventListener('input', function() {
            updateServerButtons(this.value);
        });

        // 滑块实时更新
        document.getElementById('paint-pen').addEventListener('input', function() {
            document.getElementById('pen-value').textContent = this.value;
        });

        // 下载保存数据到本地
        function downloadSave() {
            const saveData = localStorage.getItem('save');
            if (!saveData) {
                alert('没有可保存的数据');
                return;
            }

            const blob = new Blob([saveData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '保存.szy';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showStatus('✓ 已下载');
        }

        // 上传保存数据
        function uploadSave(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                localStorage.setItem('save', content);
                showStatus('✓ 已上传');
                checkPaintSection(); // 刷新显示状态
            };
            reader.onerror = function() {
                alert('读取文件失败');
            };
            reader.readAsText(file);
        }

        // 显示状态消息
        function showStatus(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.classList.add('show');
            setTimeout(() => {
                status.classList.remove('show');
            }, 2000);
        }

        // 保存设置
        function saveSettings() {
            // 基础选项
            localStorage.setItem('username', document.getElementById('username').value);
            localStorage.setItem('showname', document.getElementById('showname').value);

            // 云变量服务器
            localStorage.setItem('cloud-server', document.getElementById('cloud-server').value);

            // 画板设置（如果可见）
            const paintSection = document.getElementById('paint-section');
            if (!paintSection.classList.contains('hidden')) {
                localStorage.setItem('paint-pen', document.getElementById('paint-pen').value);
            }

            showStatus('✓ 已保存');
        }

        // 保存并关闭
        function saveAndClose() {
            saveSettings();
            window.close();
            setTimeout(() => {
                alert('设置已保存。请手动关闭此标签页。');
            }, 1000);
        }

        // 页面加载时初始化
        window.onload = function() {
            initTheme();
            loadSettings();
        };
    </script>
</body>
</html>
